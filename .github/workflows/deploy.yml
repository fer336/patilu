name: Deploy Patilu

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: patilu-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: fer336

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Test deployment contract
        run: node scripts/deployment-contract.test.mjs

      - name: Test stack version updater
        run: node scripts/set-stack-version.test.mjs

      - name: Test stack deploy validator
        run: node scripts/validate-stack-deploy.test.mjs

      - name: Test public site
        run: npm --workspace apps/www test

      - name: Typecheck public site
        run: npm --workspace apps/www run typecheck

      - name: Build public site
        run: npm --workspace apps/www run build

  release-validation:
    name: Validate production release
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
      main_sha: ${{ steps.validate.outputs.main_sha }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate stable tag and main target
        id: validate
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be stable SemVer (vMAJOR.MINOR.PATCH)." >&2
            exit 1
          fi
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            echo "GitHub prereleases cannot deploy to production." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          main_sha="$(git rev-parse origin/main)"
          if git merge-base --is-ancestor "$release_sha" "$main_sha"; then
            release_is_ancestor=true
          else
            release_is_ancestor=false
          fi
          export RELEASE_SHA="$release_sha" MAIN_SHA="$main_sha"
          export RELEASE_IS_ANCESTOR="$release_is_ancestor"
          export CHANGED_FILES="$(git diff --name-only "$release_sha" "$main_sha")"
          git show "$main_sha:docker-stack.yml" > "$RUNNER_TEMP/main-stack.yml"
          node scripts/set-stack-version.mjs --validate-release-lineage "$RUNNER_TEMP/main-stack.yml"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish images
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: [checks, release-validation]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: patilu
            context: .
            dockerfile: apps/www/Dockerfile
            build_args: ""
          - image: patilu-api
            context: apps/api
            dockerfile: apps/api/Dockerfile
            build_args: ""
          - image: patilu-cms
            context: .
            dockerfile: apps/cms/Dockerfile
            build_args: |
              VITE_API_BASE_URL=https://patilulu.com/api
    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-validation.outputs.release_sha }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:sha-${{ github.sha }}
          build-args: |
            ${{ matrix.build_args }}
            VITE_GOOGLE_CLIENT_ID=${{ matrix.image == 'patilu-cms' && secrets.GOOGLE_CLIENT_ID || '' }}

  promote:
    name: Promote release image
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: [release-validation, build]
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Promote immutable image to release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          for image in patilu patilu-api patilu-cms; do
            source="${REGISTRY}/${IMAGE_OWNER}/${image}:sha-${{ github.sha }}"
            docker buildx imagetools inspect "$source"
            docker buildx imagetools create --tag "${REGISTRY}/${IMAGE_OWNER}/${image}:${RELEASE_TAG}" "$source"
          done

  update-stack:
    name: Open stack pin PR
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: [release-validation, promote]
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_url: ${{ steps.pin.outputs.pr_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify main has not moved
        env:
          EXPECTED_MAIN_SHA: ${{ needs.release-validation.outputs.main_sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Pin stack image
        run: node scripts/set-stack-version.mjs "${{ github.event.release.tag_name }}"

      - name: Commit stack version and open PR
        id: pin
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          STACK_BRANCH: chore/pin-stack-${{ github.event.release.tag_name }}
        run: |
          test -n "${RELEASE_PR_TOKEN:-}"
          if git diff --quiet -- docker-stack.yml; then
            echo "docker-stack.yml is already pinned to $RELEASE_TAG."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${RELEASE_PR_TOKEN}@github.com/${{ github.repository }}.git"
            git fetch origin "refs/heads/$STACK_BRANCH:refs/remotes/origin/$STACK_BRANCH" || true
            remote_stack_sha="$(git rev-parse --verify "refs/remotes/origin/$STACK_BRANCH" 2>/dev/null || true)"
            git switch -C "$STACK_BRANCH"
            git add docker-stack.yml
            test "$(git diff --cached --name-only)" = "docker-stack.yml"
            git commit -m "chore(deploy): pin stack to $RELEASE_TAG"
            if [[ -n "$remote_stack_sha" ]]; then
              git push --force-with-lease="refs/heads/$STACK_BRANCH:$remote_stack_sha" origin "HEAD:refs/heads/$STACK_BRANCH"
            else
              git push origin "HEAD:refs/heads/$STACK_BRANCH"
            fi

            title="chore(deploy): pin stack to $RELEASE_TAG"
            body_file="$(mktemp)"
            printf 'This PR was generated by the release workflow after publishing %s.\n\nMerging it updates docker-stack.yml on main so Portainer deploys the pinned release image from the protected branch.\n' "$RELEASE_TAG" > "$body_file"
            pr_url="$(gh pr list --head "$STACK_BRANCH" --base main --state open --json url --jq '.[0].url // ""')"
            if [[ -n "$pr_url" ]]; then
              gh pr edit "$pr_url" --title "$title" --body-file "$body_file"
            else
              pr_url="$(gh pr create --head "$STACK_BRANCH" --base main --title "$title" --body-file "$body_file")"
            fi
            echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Trigger Portainer deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [checks]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect stack-only SemVer pin
        id: stack-pin
        run: |
          if [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "deploy_stack=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git diff --name-only "${{ github.event.before }}" HEAD)"
          if [[ "$changed_files" != "docker-stack.yml" ]]; then
            echo "deploy_stack=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show "${{ github.event.before }}:docker-stack.yml" > "$RUNNER_TEMP/docker-stack.before.yml"
          stack_tag="$(node scripts/validate-stack-deploy.mjs --before "$RUNNER_TEMP/docker-stack.before.yml" --current docker-stack.yml)"
          echo "stack_tag=$stack_tag" >> "$GITHUB_OUTPUT"
          echo "deploy_stack=true" >> "$GITHUB_OUTPUT"

      - name: Verify release image exists
        if: steps.stack-pin.outputs.deploy_stack == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${{ steps.stack-pin.outputs.stack_tag }}" --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/release.json"

      - name: Log in to GHCR
        if: steps.stack-pin.outputs.deploy_stack == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.stack-pin.outputs.deploy_stack == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Validate release provenance and promoted image
        if: steps.stack-pin.outputs.deploy_stack == 'true'
        run: |
          image_references=""
          for image in patilu patilu-api patilu-cms; do
            image_reference="${REGISTRY}/${IMAGE_OWNER}/${image}:${{ steps.stack-pin.outputs.stack_tag }}"
            docker buildx imagetools inspect "$image_reference"
            image_references="${image_references}${image_references:+,}${image_reference}"
          done
          node scripts/validate-stack-deploy.mjs \
            --tag "${{ steps.stack-pin.outputs.stack_tag }}" \
            --release-metadata "$RUNNER_TEMP/release.json" \
            --image-reference "$image_references"

      - name: Invoke Portainer webhook
        if: steps.stack-pin.outputs.deploy_stack == 'true'
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          test -n "${PORTAINER_WEBHOOK:-}"
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --retry-delay 2 \
            --retry-max-time 60 \
            --retry-all-errors \
            --request POST \
            --url "$PORTAINER_WEBHOOK"

  tag-deploy:
    name: Build images from tag push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: patilu
            context: .
            dockerfile: apps/www/Dockerfile
            build_args: ""
          - image: patilu-api
            context: apps/api
            dockerfile: apps/api/Dockerfile
            build_args: ""
          - image: patilu-cms
            context: .
            dockerfile: apps/cms/Dockerfile
            build_args: |
              VITE_API_BASE_URL=https://patilulu.com/api
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ github.ref_name }}
          build-args: |
            ${{ matrix.build_args }}
            VITE_GOOGLE_CLIENT_ID=${{ matrix.image == 'patilu-cms' && secrets.GOOGLE_CLIENT_ID || '' }}
