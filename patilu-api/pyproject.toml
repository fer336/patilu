[project]
name = "patilu-api"
version = "0.0.0"
description = "FastAPI boundary for the Patilu managed catalog platform."
requires-python = ">=3.12"
dependencies = ["fastapi[standard]>=0.116,<1.0"]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
