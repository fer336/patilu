version: "3.8"

services:
  patilu:
    image: ghcr.io/fer336/patilu:v0.1.11
    networks:
      - network_public
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('node:net');const socket=net.connect({host:'127.0.0.1',port:8080});socket.setTimeout(2000);socket.once('connect',()=>{socket.end();process.exit(0)});socket.once('timeout',()=>{socket.destroy();process.exit(1)});socket.once('error',()=>process.exit(1));"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      update_config: &update_config
        order: start-first
        failure_action: rollback
        parallelism: 1
      rollback_config: &rollback_config
        order: stop-first
        parallelism: 1
      restart_policy: &restart_policy
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.patilu.rule=Host(`patilulu.com`)
        - traefik.http.routers.patilu.entrypoints=websecure
        - traefik.http.routers.patilu.tls.certresolver=letsencryptresolver
        - traefik.http.routers.patilu.priority=10
        - traefik.http.routers.patilu-www.rule=Host(`www.patilulu.com`)
        - traefik.http.routers.patilu-www.entrypoints=web
        - traefik.http.routers.patilu-www.middlewares=patilu-www-redirect
        - traefik.http.routers.patilu-www-secure.rule=Host(`www.patilulu.com`)
        - traefik.http.routers.patilu-www-secure.entrypoints=websecure
        - traefik.http.routers.patilu-www-secure.tls.certresolver=letsencryptresolver
        - traefik.http.routers.patilu-www-secure.middlewares=patilu-www-redirect
        - traefik.http.middlewares.patilu-www-redirect.redirectregex.regex=^https?://www\.patilulu\.com/(.*)
        - traefik.http.middlewares.patilu-www-redirect.redirectregex.replacement=https://patilulu.com/$${1}
        - traefik.http.middlewares.patilu-www-redirect.redirectregex.permanent=true
        - traefik.http.services.patilu.loadbalancer.server.port=8080

networks:
  network_public:
    external: true
