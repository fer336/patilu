services:
  web:
    image: ${IMAGE_REPOSITORY:-ghcr.io/fer336/patilu-web}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      NODE_ENV: production
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      ALLOW_CATALOG_FALLBACK: ${ALLOW_CATALOG_FALLBACK:-true}
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "const net=require('node:net');const socket=net.connect({host:'127.0.0.1',port:8080});socket.setTimeout(2000);socket.once('connect',()=>{socket.end();process.exit(0)});socket.once('timeout',()=>{socket.destroy();process.exit(1)});socket.once('error',()=>process.exit(1));"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
